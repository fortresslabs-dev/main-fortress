services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: fortress-postgres
    environment:
      POSTGRES_USER: fortress
      POSTGRES_PASSWORD: fortress_dev
      POSTGRES_DB: fortress_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortress -d fortress_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fortress-redis
    command: redis-server --requirepass fortress_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fortress_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipeline1:
    build:
      context: .
      dockerfile: Dockerfile.pipeline1
    container_name: fortress-pipeline1
    env_file: .env
    environment:
      PIPELINE_MODE: pipeline1
      DATABASE_URL: postgresql+asyncpg://fortress:fortress_dev@postgres:5432/fortress_dev
      REDIS_URL: redis://:fortress_dev@redis:6379
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pipeline2:
    build:
      context: .
      dockerfile: Dockerfile.pipeline2
    container_name: fortress-pipeline2
    env_file: .env
    environment:
      PIPELINE_MODE: pipeline2
      DATABASE_URL: postgresql+asyncpg://fortress:fortress_dev@postgres:5432/fortress_dev
      REDIS_URL: redis://:fortress_dev@redis:6379
      CLIENT_NAME: dev_bank
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
