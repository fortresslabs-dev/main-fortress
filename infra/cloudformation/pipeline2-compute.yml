AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fortress Labs - Pipeline 2 Compute Stack (bank account)
  ECS Fargate auto-scaling service (2-10 tasks), ALB + WAF + ACM,
  ECR, IAM task role. JIRA webhooks hit /webhooks/jira on the API
  directly; processing runs inline via FastAPI BackgroundTasks.
  Deploy AFTER pipeline2-data.yml and after Alembic migrations.

  TrialMode=true skips ACM/HTTPS listener and fronts the ALB with CloudFront
  (default *.cloudfront.net cert) so JIRA webhooks can reach the API over
  HTTPS without a real domain. Flip to false + set BankDomain for prod.

Parameters:
  BankId:
    Type: String
    AllowedPattern: "[a-z0-9]+"
  Environment:
    Type: String
    Default: production
  ImageUri:
    Type: String
    Description: Full ECR URI with tag (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/fortress/pipeline2:latest)
  BankDomain:
    Type: String
    Description: Bank domain for ALB certificate (e.g. firstnationalbank.com). In trial mode, may be a placeholder like trial.invalid.
  EcsMinTasks:
    Type: Number
    Default: 2
  EcsMaxTasks:
    Type: Number
    Default: 10
  AlertEmail:
    Type: String
    Description: Email for CloudWatch alarm notifications
  TrialMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true = skip ACM + HTTPS listener on ALB, front the ALB with CloudFront for free HTTPS via *.cloudfront.net. Use for trials without a real domain.
  GithubTokenSecretArn:
    Type: String
    Description: Full ARN (incl. -XXXXXX suffix) of fortress/${BankId}/github-token. Resolved by deploy-p2.sh via aws secretsmanager describe-secret because this secret is created out-of-band, not by pipeline2-data.yml.
  DbName:
    Type: String
    Default: fortress_p2
    Description: Must match DbName in pipeline2-data.yml. Injected as DB_NAME so the entrypoint can compose DATABASE_URL.
  JiraIssueType:
    Type: String
    Default: Idea
    Description: JIRA issuetype for auto-created compliance stories. MDP (team-managed) only allows 'Idea'. See memory project_jira_mdp_idea_issuetype.
  AllowedOrigins:
    Type: String
    Description: >
      JSON array of allowed CORS origins (e.g. ["https://d21olk....cloudfront.net","https://dashboard.bank.dev"]).
      pydantic-settings v2 rejects comma form on List[str], so MUST be a JSON array.
      src/utils/config.py hard-fails on empty / "*" in production (see memory feedback_p2_allowed_origins_env).

Conditions:
  IsTrial: !Equals [!Ref TrialMode, "true"]
  IsProd:  !Equals [!Ref TrialMode, "false"]

Resources:

  # -- SNS Alarm Topic -------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub fortress-p2-alarms-${BankId}
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ECR repo `fortress/pipeline2-${BankId}` is created out-of-band by
  # deploy-p2.sh (it must exist before the image push, which precedes this
  # stack). Not managed here.

  # -- IAM Roles ------------------------------------------------------
  EcsExecutionRoleBank:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fortress-p2-exec-${BankId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                Resource: "*"
              # ECS resolves SSM-Parameter ARNs in the container `Secrets`
              # block using the Execution role (NOT the Task role).
              # Required for GITHUB_ORG / GITHUB_REPO / JIRA_PROJECT_KEY etc.
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/*

  EcsTaskRoleBank:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fortress-p2-task-${BankId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: P2TaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Inference profiles (Sonnet 4/4.5/4.6 and Haiku 4.5 are
                  # INFERENCE_PROFILE-only — must allow the profile ARN AND the
                  # underlying foundation-model ARNs in every region the profile
                  # may route to (us-east-1/us-east-2/us-west-2 for `us.` prefix).
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-20250514-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-20250514-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-20250514-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-20250514-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              # Bedrock auto-subscribes the invoking role to the Anthropic
              # model entry in AWS Marketplace on first InvokeModel. Without
              # these actions the call fails with:
              #   "Model access is denied due to IAM user or service role
              #    is not authorized to perform the required AWS Marketplace
              #    actions (aws-marketplace:ViewSubscriptions,
              #    aws-marketplace:Subscribe)"
              # aws-marketplace actions do not support resource-level scoping.
              - Sid: BedrockMarketplaceSubscriptions
                Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                  - aws-marketplace:Unsubscribe
                Resource: "*"
              - Sid: SecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fortress/${BankId}/*
              - Sid: SsmAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/*
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: KmsDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub FortressP2-${BankId}-KmsKeyRdsArn

  # -- ECS Cluster ----------------------------------------------------
  EcsClusterBank:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub fortress-pipeline2-${BankId}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # -- CloudWatch Log Group -------------------------------------------
  # 365d retention (FFIEC IT Hdbk minimum 1y). FTR tracker #17.
  LogGroupP2:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /fortress/pipeline2/${BankId}
      RetentionInDays: 365

  # -- ECS Task Definition --------------------------------------------
  EcsTaskDefBank:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub fortress-pipeline2-${BankId}
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt EcsExecutionRoleBank.Arn
      TaskRoleArn: !GetAtt EcsTaskRoleBank.Arn
      ContainerDefinitions:
        - Name: pipeline2
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: PIPELINE_MODE
              Value: pipeline2
            - Name: CLIENT_NAME
              Value: !Ref BankId
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: AURORA_HOST
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-AuroraEndpoint"
            - Name: AURORA_PORT
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-AuroraPort"
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: REDIS_HOST
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-RedisEndpoint"
            - Name: JIRA_ISSUE_TYPE
              Value: !Ref JiraIssueType
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
            # The long-running API container no longer drives the daily
            # sync — EventBridge → EcsTaskDefSyncP2 fires it instead (45 min
            # after the P1 02:00 UTC scrape). UpdateService.start() short
            # circuits when this is 0 so the in-process daemon doesn't race
            # the cron task.
            - Name: SYNC_INTERVAL_HOURS
              Value: "0"
          Secrets:
            # JSON-key refs (Fn::Sub form on the imported full ARN so the
            # :key:: suffix is appended after the random -XXXXXX).
            - Name: DB_USER
              ValueFrom: !Sub
                - "${Arn}:username::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretDbPasswordArn"
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretDbPasswordArn"
            - Name: JIRA_API_TOKEN
              ValueFrom: !Sub
                - "${Arn}:token::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretJiraApiTokenArn"
            - Name: JIRA_URL
              ValueFrom: !Sub
                - "${Arn}:url::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretJiraApiTokenArn"
            - Name: JIRA_USERNAME
              ValueFrom: !Sub
                - "${Arn}:username::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretJiraApiTokenArn"
            # Whole-secret refs (full ARN with -XXXXXX suffix flows in directly).
            - Name: REDIS_AUTH_TOKEN
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretRedisTokenArn"
            - Name: JWT_SECRET
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretJwtSecretArn"
            - Name: JIRA_WEBHOOK_SECRET
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretJiraWebhookSecretArn"
            - Name: INTERNAL_SYNC_SECRET
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretInternalSyncSecretArn"
            - Name: PIPELINE1_API_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretPipeline1ApiKeyArn"
            # github-token is created out-of-band; deploy-p2.sh looks up the
            # full ARN and passes it via the GithubTokenSecretArn parameter.
            - Name: GITHUB_TOKEN
              ValueFrom: !Ref GithubTokenSecretArn
            # ECS `Secrets` block also accepts SSM Parameter ARNs (not just
            # SecretsManager) — use it to surface non-secret SSM values as env
            # vars without bloating the Environment list with literal Sub'd
            # parameter paths.
            - Name: GITHUB_ORG
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/GITHUB_ORG"
            - Name: GITHUB_REPO
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/GITHUB_REPO"
            - Name: JIRA_PROJECT_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/JIRA_PROJECT_KEY"
            # Cognito pool + client — src/api/auth.py fails closed (503) if
            # either is unset, but before 2026-07-07 they were only wired
            # into the dashboard build (VITE_*), not the API container.
            # Result: JWT validation was structurally unreachable and the
            # front-end interceptor's tokens went nowhere. The dashboard
            # deploy.sh already fetches the same SSM values.
            - Name: COGNITO_USER_POOL_ID
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/COGNITO_USER_POOL_ID"
            - Name: COGNITO_CLIENT_ID
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fortress/${BankId}/COGNITO_CLIENT_ID"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupP2
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
            Interval: 30
            Timeout: 10
            Retries: 3

  # -- ECS Sync Task Definition (one-shot — fired by EventBridge) -----
  # Mirrors P1's EcsTaskDefScraperP1 pattern. Reuses the API image + roles
  # + secrets so credentials, settings, and DB plumbing are identical to
  # what the long-running API container already uses. Container starts,
  # calls UpdateService.sync_all() once via scripts/run_sync.py, exits.
  EcsTaskDefSyncP2:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub fortress-pipeline2-sync-${BankId}
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt EcsExecutionRoleBank.Arn
      TaskRoleArn: !GetAtt EcsTaskRoleBank.Arn
      ContainerDefinitions:
        - Name: pipeline2-sync
          Image: !Ref ImageUri
          Essential: true
          Command: ["python3", "-m", "scripts.run_sync"]
          Environment:
            - Name: PYTHONPATH
              Value: /app
            - Name: PIPELINE_MODE
              Value: pipeline2
            - Name: CLIENT_NAME
              Value: !Ref BankId
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: AURORA_HOST
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-AuroraEndpoint"
            - Name: AURORA_PORT
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-AuroraPort"
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: REDIS_HOST
              Value: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-RedisEndpoint"
            # config.py hard-fails on empty / "*" in production, even for
            # non-server entrypoints — the gate runs at import time.
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - "${Arn}:username::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretDbPasswordArn"
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${Arn}:password::"
                - Arn: !ImportValue
                    Fn::Sub: "FortressP2-${BankId}-SecretDbPasswordArn"
            - Name: REDIS_AUTH_TOKEN
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretRedisTokenArn"
            - Name: INTERNAL_SYNC_SECRET
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretInternalSyncSecretArn"
            - Name: PIPELINE1_API_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "FortressP2-${BankId}-SecretPipeline1ApiKeyArn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupP2
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sync

  # -- EventBridge Scheduler (one-shot sync — daily 02:45 UTC) --------
  # Fires 45 min after the P1 scrape window starts (P1 scrape = 02:00 UTC,
  # see pipeline1-compute.yml ScraperSchedule). The buffer covers the
  # connector cycle so P1 has fresh records ready when P2 pulls them.
  EventBridgeRoleP2:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fortress-p2-eventbridge-${BankId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunSyncTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                # Wildcard the revision so each new CFN deploy that
                # publishes a new task-def revision is immediately
                # runnable without an IAM update lagging behind the
                # EventBridge target.
                Resource:
                  - !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/fortress-pipeline2-sync-${BankId}:*
                Condition:
                  ArnEquals:
                    "ecs:cluster": !GetAtt EcsClusterBank.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt EcsTaskRoleBank.Arn
                  - !GetAtt EcsExecutionRoleBank.Arn

  SyncSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub fortress-p2-daily-sync-${BankId}
      Description: Daily P1→P2 sync — 02:45 UTC (45 min after P1 scrape)
      ScheduleExpression: "cron(45 2 * * ? *)"
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EcsClusterBank.Arn
        RoleArn: !GetAtt EventBridgeRoleP2.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref EcsTaskDefSyncP2
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              SecurityGroups:
                - Fn::ImportValue: !Sub FortressP2-${BankId}-SgEcs
              Subnets:
                - Fn::ImportValue: !Sub FortressP2-${BankId}-PrivateSubnetA
                - Fn::ImportValue: !Sub FortressP2-${BankId}-PrivateSubnetB
        RetryPolicy:
          MaximumRetryAttempts: 2

  # -- ALB Access Logs (FTR tracker #12) ------------------------------
  # Glacier transition @ 90d, expire @ 365d. SSE-S3, no public access,
  # BucketOwnerEnforced (no ACLs). 127311923021 is the us-east-1 ELB
  # service account — if region changes, update from the regional table at
  # docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
  AlbAccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub fortress-p2-alb-logs-${BankId}-${Environment}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveThenExpire
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 90
            ExpirationInDays: 365

  AlbAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AlbAccessLogsWrite
            Effect: Allow
            Principal:
              AWS: arn:aws:iam::127311923021:root
            Action: s3:PutObject
            Resource: !Sub ${AlbAccessLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*

  # -- ALB ------------------------------------------------------------
  AlbBank:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbAccessLogsBucketPolicy
    Properties:
      Name: !Sub fortress-p2-alb-${BankId}
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue: !Sub FortressP2-${BankId}-SgAlb
      Subnets:
        - Fn::ImportValue: !Sub FortressP2-${BankId}-PublicSubnetA
        - Fn::ImportValue: !Sub FortressP2-${BankId}-PublicSubnetB
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: deletion_protection.enabled
          Value: !If [IsProd, "true", "false"]
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AlbAccessLogsBucket

  TargetGroupBank:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub fortress-p2-tg-${BankId}
      Port: 8000
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub FortressP2-${BankId}-VpcId
      TargetType: ip
      # Trailing slash matters — health router is mounted at prefix '/health' with
      # route '/', so /health (no slash) returns 307 → unhealthy.
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  AcmCertBank:
    Type: AWS::CertificateManager::Certificate
    Condition: IsProd
    Properties:
      DomainName: !Sub fortressapi.${BankDomain}
      ValidationMethod: DNS

  ListenerHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsProd
    Properties:
      LoadBalancerArn: !Ref AlbBank
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertBank
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBank

  ListenerHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AlbBank
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - IsTrial
          - Type: forward
            TargetGroupArn: !Ref TargetGroupBank
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301

  # -- WAF ------------------------------------------------------------
  WafWebAclBank:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub fortress-p2-waf-${BankId}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        - Name: RateLimit
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub RateLimit${BankId}
        - Name: AWSManagedRulesCommon
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub AWSCommon${BankId}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub FortressP2Waf${BankId}

  WafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref AlbBank
      WebACLArn: !GetAtt WafWebAclBank.Arn

  # -- ECS Service (auto-scale 2-10 tasks) ----------------------------
  EcsServiceBank:
    Type: AWS::ECS::Service
    # The target group is attached to the ALB by the listener (HTTP in trial,
    # HTTPS in prod). Without this DependsOn, CFN races the Service against
    # the listener and ECS rejects the TG with "does not have an associated
    # load balancer". ListenerHttp always exists; in prod it redirects to
    # HTTPS while ListenerHttps does the TG attachment — prod deploys must
    # also wait for ListenerHttps, handled below via the LoadBalancers Tag
    # reference (CFN auto-orders on !Ref, so the conditional !If keeps the
    # template valid in trial where ListenerHttps doesn't exist).
    DependsOn:
      - ListenerHttp
    Properties:
      ServiceName: !Sub fortress-pipeline2-${BankId}
      Cluster: !Ref EcsClusterBank
      TaskDefinition: !Ref EcsTaskDefBank
      LaunchType: FARGATE
      DesiredCount: !Ref EcsMinTasks
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub FortressP2-${BankId}-SgEcs
          Subnets:
            - Fn::ImportValue: !Sub FortressP2-${BankId}-PrivateSubnetA
            - Fn::ImportValue: !Sub FortressP2-${BankId}-PrivateSubnetB
      LoadBalancers:
        - ContainerName: pipeline2
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroupBank
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 60
      PropagateTags: SERVICE
      Tags:
        - Key: ListenerHttpsOrdering
          Value: !If [IsProd, !Ref ListenerHttps, "n/a"]

  # -- Auto Scaling ---------------------------------------------------
  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !Ref EcsMinTasks
      MaxCapacity: !Ref EcsMaxTasks
      ResourceId: !Sub service/${EcsClusterBank}/${EcsServiceBank.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicyCpu:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub fortress-p2-cpu-scaling-${BankId}
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # -- CloudWatch Alarms ----------------------------------------------
  AlarmApiLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fortress-p2-api-latency-${BankId}
      AlarmDescription: API p99 latency > 3s
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt AlbBank.LoadBalancerFullName
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]

  # -- CloudFront in front of ALB (trial only) -----------------------
  # Provides public HTTPS via the default *.cloudfront.net cert so JIRA
  # webhooks can reach the API without a real domain. In prod the ALB
  # serves HTTPS directly via ACM on fortressapi.${BankDomain}.
  ApiCloudFront:
    Type: AWS::CloudFront::Distribution
    Condition: IsTrial
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: AlbOrigin
            DomainName: !GetAtt AlbBank.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: AlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3   # Managed-AllViewer

Outputs:
  AlbDns:
    Value: !GetAtt AlbBank.DNSName
    Description: Point fortressapi.{BankDomain} CNAME here after ACM validation (prod). In trial, use ApiEndpoint instead.
    Export:
      Name: !Sub FortressP2-${BankId}-AlbDns

  ApiEndpoint:
    Description: Public HTTPS API URL — CloudFront in trial, fortressapi.<BankDomain> in prod. Point JIRA webhook here.
    Value: !If
      - IsTrial
      - !Sub "https://${ApiCloudFront.DomainName}"
      - !Sub "https://fortressapi.${BankDomain}"
    Export:
      Name: !Sub FortressP2-${BankId}-ApiEndpoint

  EcsServiceName:
    Value: !GetAtt EcsServiceBank.Name
    Export:
      Name: !Sub FortressP2-${BankId}-EcsServiceName

  SyncTaskDefArn:
    Value: !Ref EcsTaskDefSyncP2
    Description: One-shot sync task — fired by EventBridge daily at 02:45 UTC
    Export:
      Name: !Sub FortressP2-${BankId}-EcsTaskDefSyncArn

  SyncScheduleName:
    Value: !Ref SyncSchedule
    Description: EventBridge schedule firing the daily P2 sync at 02:45 UTC

  AlbAccessLogsBucket:
    Value: !Ref AlbAccessLogsBucket
    Description: S3 bucket holding ALB access logs (lifecycle GLACIER @ 90d, expire @ 365d)
    Export:
      Name: !Sub FortressP2-${BankId}-AlbAccessLogsBucket
