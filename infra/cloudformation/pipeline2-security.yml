AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fortress Labs - Pipeline 2 Security Stack (bank account)
  Security Hub (PCI DSS + FSBP), GuardDuty, CloudTrail.
  Bank manages all findings - Fortress has no visibility.

Parameters:
  BankId:
    Type: String
    AllowedPattern: "[a-z0-9]+"
  Environment:
    Type: String
    Default: production
  CloudTrailBucketName:
    Type: String
    Description: Bank S3 bucket for CloudTrail logs
  AlertEmail:
    Type: String
    Description: Bank security-team email for IAM policy-change + security alerts (SNS — manual confirm required)
    Default: ""

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      Features:
        - Name: RUNTIME_MONITORING
          Status: ENABLED
          AdditionalConfiguration:
            - Name: ECS_FARGATE_AGENT_MANAGEMENT
              Status: ENABLED
        - Name: RDS_LOGIN_EVENTS
          Status: ENABLED

  SecurityHubHub:
    Type: AWS::SecurityHub::Hub
    Properties:
      EnableDefaultStandards: false

  SecurityHubPciDss:
    Type: AWS::SecurityHub::Standard
    DependsOn: SecurityHubHub
    Properties:
      StandardsArn: !Sub arn:aws:securityhub:${AWS::Region}::standards/pci-dss/v/3.2.1

  SecurityHubFsbp:
    Type: AWS::SecurityHub::Standard
    DependsOn: SecurityHubHub
    Properties:
      StandardsArn: !Sub arn:aws:securityhub:${AWS::Region}::standards/aws-foundational-security-best-practices/v/1.0.0

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub arn:aws:s3:::${CloudTrailBucketName}
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${CloudTrailBucketName}/cloudtrail/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub fortress-p2-trail-${BankId}
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      S3BucketName: !Ref CloudTrailBucketName
      S3KeyPrefix: !Sub cloudtrail/${BankId}
      IncludeGlobalServiceEvents: true

  # -- Security Alerts SNS + IAM-policy-change rule (FTR tracker #13) --
  # CIS Benchmark 4.4 - alert on any IAM policy mutation. IAM is a global
  # service so its CloudTrail events surface in us-east-1 EventBridge only;
  # this stack is us-east-1 so we're good. AlertEmail subscription needs
  # one-time confirmation from the email link.
  SecurityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub fortress-p2-security-alerts-${BankId}
      DisplayName: !Sub "Fortress P2 Security Alerts (${BankId})"

  SecurityAlertsTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref SecurityAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  SecurityAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref SecurityAlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityAlertsTopic

  IamPolicyChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub fortress-p2-iam-policy-change-${BankId}
      Description: Fires SNS alert on any IAM policy mutation (CIS 4.4)
      State: ENABLED
      EventPattern:
        source: [aws.iam]
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          eventSource: [iam.amazonaws.com]
          eventName:
            - CreatePolicy
            - DeletePolicy
            - CreatePolicyVersion
            - DeletePolicyVersion
            - SetDefaultPolicyVersion
            - AttachUserPolicy
            - DetachUserPolicy
            - AttachRolePolicy
            - DetachRolePolicy
            - AttachGroupPolicy
            - DetachGroupPolicy
            - PutUserPolicy
            - PutRolePolicy
            - PutGroupPolicy
            - DeleteUserPolicy
            - DeleteRolePolicy
            - DeleteGroupPolicy
      Targets:
        - Id: SecurityAlertsTopic
          Arn: !Ref SecurityAlertsTopic

  # -- IAM Access Analyzer (FTR tracker #14) --------------------------
  # Account-scope analyzer surfaces external-access on IAM roles, S3
  # buckets, KMS keys, Secrets, Lambda, SQS, etc. Findings flow to
  # Security Hub automatically; the EventBridge rule below also pushes
  # *new ACTIVE* findings to SecurityAlertsTopic for direct email.
  AccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: !Sub fortress-p2-account-analyzer-${BankId}
      Type: ACCOUNT

  AccessAnalyzerFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub fortress-p2-access-analyzer-finding-${BankId}
      Description: Fires SNS alert on new ACTIVE Access Analyzer findings
      State: ENABLED
      EventPattern:
        source: [aws.access-analyzer]
        detail-type: ["Access Analyzer Finding"]
        detail:
          status: [ACTIVE]
      Targets:
        - Id: SecurityAlertsTopic
          Arn: !Ref SecurityAlertsTopic

Outputs:
  SecurityAlertsTopicArn:
    Value: !Ref SecurityAlertsTopic
    Description: SNS topic for IAM policy changes, Access Analyzer findings, and #15 Budgets
    Export:
      Name: !Sub FortressP2-${BankId}-SecurityAlertsTopicArn

  AccessAnalyzerArn:
    Value: !GetAtt AccessAnalyzer.Arn
    Description: Account-scope IAM Access Analyzer (external-access findings)
    Export:
      Name: !Sub FortressP2-${BankId}-AccessAnalyzerArn
